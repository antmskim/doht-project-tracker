# Generated by `fly launch` — app name will be filled in for you.
# See README.md for full deploy steps.
app = "doht-project-tracker"
primary_region = "ewr"

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "tracker_data"
  destination = "/app/data"
