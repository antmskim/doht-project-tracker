services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_PASSCODE: ${APP_PASSCODE}
      PORT: "3000"
      NODE_ENV: production
    volumes:
      - tracker_data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  tracker_data:
  caddy_data:
  caddy_config:
